name: Build CandyAdventure IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle Identifier'
        required: true
        default: 'com.example.candyadventure'
      export_method:
        description: 'Export Method (development, ad-hoc, app-store)'
        required: true
        default: 'development'

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Build IPA
      run: |
        chmod +x build_ipa.sh
        ./build_ipa.sh -b "${{ github.event.inputs.bundle_id }}" -m "${{ github.event.inputs.export_method }}"
